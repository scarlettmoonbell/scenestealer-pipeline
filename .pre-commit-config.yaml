# Mirrors checks.yml/docs.yml/actionlint.yml's static checks locally,
# before a commit even happens - see CLAUDE.md for setup (`pipx install
# pre-commit`, then `pre-commit install` once per clone).
#
# eslint/prettier run as local hooks against this project's own npm-managed
# node_modules (via `npm run`), not a pre-commit-managed copy - the whole
# point is checking with the *exact* devDependency versions/config this
# project already pins in package.json, matching what CI actually runs.
# typecheck/build/test are deliberately not included: they're slower than
# the fast, focused local feedback pre-commit hooks are for, and CI already
# covers them on every PR — test in particular shells out to ffmpeg/
# scenedetect for some cases, which isn't guaranteed present on every
# machine running a commit hook.
#
# actionlint/gitleaks/markdownlint-cli2 are hook-managed, self-bootstrapped
# tools (Go/Node) that pre-commit installs into its own isolated per-hook
# environment under ~/.cache/pre-commit - never touching system Node/Go.

repos:
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        files: \.([cm]?[jt]s)$
        pass_filenames: false

      - id: prettier-check
        name: Prettier (check)
        entry: npm run format
        language: system
        files: \.([cm]?[jt]s|json|ya?ml|md)$
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.1
    hooks:
      - id: markdownlint-cli2
